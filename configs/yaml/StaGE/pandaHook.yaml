RRT:
  verbose: 3
  output_dir: ${hydra:runtime.output_dir}
  
  start_idx: -1
  max_expansions_per_tree: 5000
  max_configs: -1
  
  # StaGE params
  remove_expanded: True

  # Distance threshholds
  min_cost: 0.1

  # MPC actions
  tau_action: 0.25
  stepsize: [
    0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 128.0,
  ]

  # Distance measurements
  q: [0, 8]
  q_dot: [0, 8]
  q_obj_dot: [9, 16]  # Weird jump to 9 because of two joints for the gripper finger.
  P: ["hook", "hook_hook", "obj"]
  G: ["hook", "hook_hook", "obj"]

  obs_pos_scale: 1.0
  obs_vel_scale: 0.1
  obs_ref_err_scale: 10.0

  q_weight: 0.5

  sim_interface:
    parallel_sims: 50
    xml_path: "configs/mujoco_/franka_emika_panda/panda_single.xml"
    tau_sim: 0.005
    verbose: 1

    joint_vel_ids: [0,8]

    camera: "fixed_cam"
    render_w: 640
    render_h: 480

configs_path: "configs/stable/pandaHook.h5"
